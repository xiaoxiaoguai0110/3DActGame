name: ✅ Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: C# Syntax & Project Structure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check C# files exist
        run: |
          count=$(find Assets/Scripts -name "*.cs" | wc -l)
          echo "Found $count C# scripts"
          if [ "$count" -eq 0 ]; then
            echo "No C# scripts found!"
            exit 1
          fi

      - name: Check Scene files exist
        run: |
          count=$(find Assets/Scenes -name "*.unity" | wc -l)
          echo "Found $count scene files"
          if [ "$count" -eq 0 ]; then
            echo "No scene files found!"
            exit 1
          fi

      - name: Verify all required scripts exist
        run: |
          required=(
            "Assets/Scripts/Player.cs"
            "Assets/Scripts/Enemy.cs"
            "Assets/Scripts/Health.cs"
            "Assets/Scripts/WeaponDamage.cs"
            "Assets/Scripts/CameraController.cs"
            "Assets/Scripts/UI/MainMenuUI.cs"
            "Assets/Scripts/Manager/InputReader.cs"
            "Assets/Scripts/Manager/AudioManager.cs"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing required files missing!"
            exit 1
          fi
          echo "All required files present"

      - name: ✅ Done
        run: echo "Project structure validation passed!"
